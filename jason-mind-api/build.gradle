plugins {
    id 'java-library'
    id 'maven-publish'
}

version "${jasonVersion}"
group   "${groupId}"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        url "https://jitpack.io"
        content { includeGroup "com.github.gabrielramosalv.peel-web" }
    }
}

dependencies {
    api project(':jason-interpreter')

    implementation 'com.github.gabrielramosalv.peel-web:peel-web-core:v1.2.0'

    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    testCompileOnly 'org.projectlombok:lombok:1.18.36'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

sourceSets {
    main {
        resources {
            srcDir project(':jason-mind-ui').layout.buildDirectory.dir('generated-resources')
        }
    }
}

processResources {
    dependsOn ':jason-mind-ui:copyUi'
}

jar {
    archiveBaseName = 'jason-mind-api'
    manifest {
        attributes 'Specification-Title': 'Jason Mind API',
                   'Specification-Version': project.version
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'jason-mind-api'
            from components.java
        }
    }
}

processResources {
    inputs.property "mindApiVersion", mindApiVersion
    filesMatching("jason/mind/api/mind-api.properties") {
        expand(mindApiVersion: mindApiVersion)
    }
}

tasks.named("test") {
    useJUnitPlatform()
    systemProperty "java.awt.headless", "true"
}
